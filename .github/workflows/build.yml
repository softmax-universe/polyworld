name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 5
    env:
      POLYWORLD_DEPS: ${{ github.workspace }}/..
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby sync "${{ github.event.repository.name }}/nimby.lock"
      - name: Check and run unit tests
        shell: bash
        run: |
          nim check -d:release tests/unit_tests.nim
          nim r -d:release tests/unit_tests.nim
