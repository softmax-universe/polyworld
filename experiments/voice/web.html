<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polyworld Voice Lab</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #11171a; color: #e5ece8; }
      main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
      header { padding: .65rem 1rem; border-bottom: 1px solid #354346; }
      .controls { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }
      button, input {
        border: 1px solid #526461; border-radius: .4rem;
        padding: .5rem .7rem; font: inherit;
      }
      button { cursor: pointer; background: #212b2e; color: #e5ece8; }
      button.primary { background: #a4e0c7; color: #11171a; }
      button:disabled { cursor: default; opacity: .45; }
      input { background: #11171a; color: #e5ece8; min-width: 8rem; }
      #api-key { width: min(23rem, 100%); }
      #key-hint, #browser-status { margin: .45rem 0 0; font-size: .8rem; }
      #key-hint { color: #91a3a0; }
      #browser-status.error { color: #ff9791; }
      #stage { flex: 1; min-height: 260px; overflow: hidden; }
      #canvas { display: block; width: 100%; height: 100%; outline: none; }
      #message-form { display: flex; gap: .5rem; padding: .65rem 1rem; }
      #message { flex: 1; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0;
        margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
      }
      @media (max-width: 650px) {
        header { padding: .5rem; }
        #key-hint { max-width: 34rem; }
        #message-form { padding: .5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="controls">
          <button id="conversation" class="primary" disabled>Start conversation</button>
          <button id="connect" disabled>Connect</button>
          <button id="disconnect" disabled>Disconnect</button>
          <label for="api-key">API key</label>
          <input id="api-key" type="password" autocomplete="off"
            placeholder="Optional when the server has a key" aria-describedby="key-hint">
        </div>
        <p id="key-hint">Checking the local server. Keys are never saved in this page.</p>
        <p id="browser-status" role="status">Loading Voice Lab...</p>
      </header>
      <div id="stage">
        <canvas id="canvas" tabindex="0" aria-label="Voice Lab conversation and controls"
          oncontextmenu="event.preventDefault()"></canvas>
      </div>
      <form id="message-form">
        <label class="sr-only" for="message">Message</label>
        <input id="message" placeholder="Type a message, or start a voice conversation"
          maxlength="4000" autocomplete="off">
        <button id="send" type="submit" disabled>Send</button>
      </form>
      <div id="transcript" class="sr-only" aria-live="polite"></div>
    </main>
    <script>
      const status = document.getElementById('browser-status');
      const conversation = document.getElementById('conversation');
      const connect = document.getElementById('connect');
      const disconnect = document.getElementById('disconnect');
      const send = document.getElementById('send');
      let runtimeReady = false;
      let transcript = '';
      let lastState = {};
      let pollTimer;
      function showError(error) {
        status.textContent = error.message || String(error);
        status.classList.add('error');
      }
      function action(value) {
        if (!runtimeReady) return;
        try { Module._voiceBrowserAction(value); }
        catch (error) { showError(error); }
      }
      function updateState() {
        if (!runtimeReady) return;
        try {
          const pointer = Module._voiceBrowserState();
          const state = JSON.parse(Module.UTF8ToString(pointer) || '{}');
          lastState = state;
          const initialized = Object.keys(state).length > 0;
          conversation.disabled = !initialized;
          conversation.textContent = state.conversationRequested
            ? 'Stop conversation' : 'Start conversation';
          connect.disabled = !initialized || state.connected || state.connecting;
          disconnect.disabled = !initialized || !(state.connected || state.connecting || state.conversationRequested);
          send.disabled = !state.connected;
          status.textContent = state.error || state.status || 'Starting Voice Lab...';
          status.classList.toggle('error', Boolean(state.error));
          if (state.lines) {
            const text = state.lines.map(line => (line.user ? 'You: ' : 'Voice: ') + line.text).join('\n');
            if (text !== transcript) {
              transcript = text;
              document.getElementById('transcript').textContent = text;
            }
          }
        } catch (error) { showError(error); }
      }
      var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized() {
          runtimeReady = true;
          pollTimer = setInterval(updateState, 100);
        },
        onAbort(message) { showError(new Error('Voice Lab could not start: ' + message)); }
      };
      conversation.addEventListener('click', () => action(4));
      connect.addEventListener('click', () => action(0));
      disconnect.addEventListener('click', () => action(1));
      document.getElementById('message-form').addEventListener('submit', event => {
        event.preventDefault();
        if (!runtimeReady || !lastState.connected) return;
        const input = document.getElementById('message');
        const text = input.value.trim();
        if (!text) return;
        try {
          Module.ccall('voiceBrowserText', null, ['string'], [text]);
          input.value = '';
        } catch (error) { showError(error); }
      });
      window.addEventListener('pagehide', () => {
        clearInterval(pollTimer);
        action(1);
        document.getElementById('api-key').value = '';
      });
      fetch('/api/config', {cache: 'no-store'}).then(response => {
        if (!response.ok) throw new Error('Start this page through the Voice Lab server.');
        return response.json();
      }).then(config => {
        document.getElementById('key-hint').textContent = config.keyAvailable
          ? 'The local server has an OpenAI key. Leave this field blank to use it.'
          : 'Enter your OpenAI key for this session. It is not saved.';
      }).catch(error => {
        document.getElementById('key-hint').textContent = error.message;
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
